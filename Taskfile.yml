    vars:
      FILE: '{{.FILE | default "examples/in/basic.ft"}}'
      FORMAT: '{{.FORMAT | default "json"}}'
      PHASE: '{{.PHASE | default "all"}}'
      SUMMARY: '{{.SUMMARY | default "false"}}'

  # Development tasks
  dev:watch:
    desc: Watch for changes and run tests
    cmds:
      - watchexec -r "task test"

  dev:lint:
    desc: Run linters
    dir: forst
    cmds:
      - golangci-lint run ./...

  dev:format:
    desc: Format code
    dir: forst
    cmds:
      - go fmt ./...

  dev:vet:
    desc: Run go vet
    dir: forst
    cmds:
      - go vet ./...

  fix:check:
    desc: Verify go fix modernizers produce no diff (Go 1.26)
    dir: forst
    cmds:
      - go fix -diff ./...

  profile:forst:
    desc: Generate forst/default.pgo for release builds (re-run when typechecker/parser hot paths change)
    dir: forst
    cmds:
      - |
        set -euo pipefail
        profiles=()
        while IFS= read -r pkg; do
          prof="$(mktemp -t forst-pgo-XXXX.pgo)"
          profiles+=("$prof")
          go test -bench=NONE -count=1 -timeout=30m -cpuprofile="$prof" "$pkg"
        done < <(go list ./internal/typechecker/... ./internal/parser/... ./internal/transformer/... ./cmd/forst/...)
        go tool pprof -proto -output=default.pgo "${profiles[@]}"
        rm -f "${profiles[@]}"

  # Documentation tasks
  docs:generate:
    desc: Generate documentation
    dir: forst
    cmds:
      - godoc -http=:6060

  # CI/CD tasks
  check:coverage:
    desc: Fail if merged statement coverage is below MIN_COVERAGE (default 72); uses profile.cov from last go test or runs tests
    dir: forst
    vars:
      MIN_COVERAGE: '{{.MIN_COVERAGE | default "72"}}'
    cmds:
      - |
        if [ ! -f profile.cov ]; then
          PKGS=$(go list ./cmd/forst/... ./internal/... ./bridgert/... | paste -sd, -)
          go test -coverprofile=profile.cov -coverpkg="$PKGS" ./cmd/forst/... ./internal/... ./bridgert/... -count=1
        fi
      - bash scripts/check_coverage_threshold.sh profile.cov {{.MIN_COVERAGE}}

  test:go:short:
    desc: Fast Go unit tests (skips -short gated integration tests)
    dir: forst
    cmds:
      - go test -short -count=1 ./cmd/forst/... ./internal/...

  ci:test:
    desc: Run CI coverage suite (Go tests + Coveralls profile)
    dir: forst
    set: [errexit]
    deps: [build:runtime]
    cmds:
      - task: build:vscode
      - |
        PKGS=$(go list ./cmd/forst/... ./internal/... ./bridgert/... | paste -sd, -)
        go test -race -covermode atomic -coverpkg="$PKGS" -coverprofile=profile.cov -timeout=10m ./cmd/forst/... ./internal/... ./bridgert/...

  ci:e2e:
    desc: Run CI E2E suite (runtime examples, node interop, sidecar, providers)
    set: [errexit]
    deps: [build:runtime]
    cmds:
      - task: build
      - task: test:cli
      - task: test:cli:invoke-e2e
      - task: test:sidecar
      - task: bridge-interop:smoke
      - task: test:bridge-host-e2e
      - task: test:multipackage-dev
      - task: example:embedded-invoke:run
      - task: example:bridge-interop-sync
      - task: example:bridge-interop-promises
      - task: example:bridge-interop-generators
      - task: example:bridge-interop-async
      - task: example:bridge-interop-modules
      - task: example:multipackage-dev:reload-e2e
      - task example:sidecar-local
      - task example:sidecar-downloaded
      - task test:tictactoe
      - task test:providers
      - task test:providers-cross_pkg
      - task: example:bridge-interop-remix-serve:standalone-e2e

  # Release tasks
  build:release:
    desc: Build release binaries for multiple platforms
    dir: forst
    cmds:
      - mkdir -p ../dist
      - |
        set -euo pipefail
        PGO_FLAG=""
        if [ -f default.pgo ]; then PGO_FLAG="-pgo=default.pgo"; fi
        VERSION="{{.VERSION | default "dev"}}"
        COMMIT="{{.COMMIT | default "unknown"}}"
        DATE="{{.DATE | default "unknown"}}"
        LDFLAGS="-s -w -X main.Version=${VERSION} -X main.Commit=${COMMIT} -X main.Date=${DATE}"
        BINARY="{{.BINARY_NAME}}"
        BUILD_DIR="{{.BUILD_DIR}}"
        GOOS=linux GOARCH=amd64 go build ${PGO_FLAG} -ldflags="${LDFLAGS}" -o ../dist/${BINARY}-linux-amd64 ./${BUILD_DIR}
        GOOS=linux GOARCH=arm64 go build ${PGO_FLAG} -ldflags="${LDFLAGS}" -o ../dist/${BINARY}-linux-arm64 ./${BUILD_DIR}
        GOOS=darwin GOARCH=amd64 go build ${PGO_FLAG} -ldflags="${LDFLAGS}" -o ../dist/${BINARY}-darwin-amd64 ./${BUILD_DIR}
        GOOS=darwin GOARCH=arm64 go build ${PGO_FLAG} -ldflags="${LDFLAGS}" -o ../dist/${BINARY}-darwin-arm64 ./${BUILD_DIR}
        GOOS=windows GOARCH=amd64 go build ${PGO_FLAG} -ldflags="${LDFLAGS}" -o ../dist/${BINARY}-windows-amd64.exe ./${BUILD_DIR}
        GOOS=windows GOARCH=arm64 go build ${PGO_FLAG} -ldflags="${LDFLAGS}" -o ../dist/${BINARY}-windows-arm64.exe ./${BUILD_DIR}
        PLUGINS=(
          "forst-gen-jsonschema:./plugins/forst-gen-jsonschema"
          "forst-gen-orpc:./plugins/forst-gen-orpc"
          "forst-gen-file-routes:./plugins/forst-gen-file-routes"
          "forst-gen-react-router:./plugins/forst-gen-react-router"
          "forst-gen-echo:./plugins/forst-gen-echo"
        )
        build_release_plugins() {
          local goos="$1" goarch="$2" suffix="$3" outdir="$4"
          mkdir -p "$outdir"
          for entry in "${PLUGINS[@]}"; do
            local name="${entry%%:*}"
            local pkg="${entry#*:}"
            GOOS="$goos" GOARCH="$goarch" go build ${PGO_FLAG} -ldflags="${LDFLAGS}" -o "${outdir}/${name}${suffix}" "$pkg"
          done
        }
        build_release_plugins linux amd64 "" ../dist/plugins-linux-amd64
        build_release_plugins linux arm64 "" ../dist/plugins-linux-arm64
        build_release_plugins darwin amd64 "" ../dist/plugins-darwin-amd64
        build_release_plugins darwin arm64 "" ../dist/plugins-darwin-arm64
        build_release_plugins windows amd64 .exe ../dist/plugins-windows-amd64
        build_release_plugins windows arm64 .exe ../dist/plugins-windows-arm64
      - tar -czf ../dist/{{.BINARY_NAME}}-linux-amd64.tar.gz -C ../dist {{.BINARY_NAME}}-linux-amd64
      - tar -czf ../dist/{{.BINARY_NAME}}-linux-arm64.tar.gz -C ../dist {{.BINARY_NAME}}-linux-arm64
      - tar -czf ../dist/{{.BINARY_NAME}}-darwin-amd64.tar.gz -C ../dist {{.BINARY_NAME}}-darwin-amd64
      - tar -czf ../dist/{{.BINARY_NAME}}-darwin-arm64.tar.gz -C ../dist {{.BINARY_NAME}}-darwin-arm64
      - cd ../dist && zip {{.BINARY_NAME}}-windows-amd64.zip {{.BINARY_NAME}}-windows-amd64.exe
      - cd ../dist && zip {{.BINARY_NAME}}-windows-arm64.zip {{.BINARY_NAME}}-windows-arm64.exe
      - tar -czf ../dist/forst-plugins-linux-amd64.tar.gz -C ../dist/plugins-linux-amd64 .
      - tar -czf ../dist/forst-plugins-linux-arm64.tar.gz -C ../dist/plugins-linux-arm64 .
      - tar -czf ../dist/forst-plugins-darwin-amd64.tar.gz -C ../dist/plugins-darwin-amd64 .
      - tar -czf ../dist/forst-plugins-darwin-arm64.tar.gz -C ../dist/plugins-darwin-arm64 .
      - cd ../dist/plugins-windows-amd64 && zip ../forst-plugins-windows-amd64.zip *.exe
      - cd ../dist/plugins-windows-arm64 && zip ../forst-plugins-windows-arm64.zip *.exe
      - |
        set -euo pipefail
        VERSION="{{.VERSION | default "dev"}}"
        tar -czf ../dist/forst-module-${VERSION}.tar.gz \
          --exclude='.forst' \
          -C . .
    generates:
      - ../dist/*.tar.gz
      - ../dist/forst-module-*.tar.gz
      - ../dist/*.zip

  install:nfpm:
    desc: Install pinned nfpm to /usr/local/bin (requires sudo)
    cmds:
      - |
        set -euo pipefail
        NFPM_VERSION="{{.NFPM_VERSION}}"
        ARCH="$(uname -m)"
        case "$ARCH" in
          x86_64) NFPM_ARCH=x86_64 ;;
          aarch64|arm64) NFPM_ARCH=arm64 ;;
          *) echo "unsupported arch for nfpm install: $ARCH" >&2; exit 1 ;;
        esac
        TARBALL="nfpm_${NFPM_VERSION}_Linux_${NFPM_ARCH}.tar.gz"
        BASE="https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}"
        curl -fsSL -o "/tmp/${TARBALL}" "${BASE}/${TARBALL}"
        curl -fsSL -o /tmp/nfpm-checksums.txt "${BASE}/checksums.txt"
        ( cd /tmp && grep " ${TARBALL}\$" nfpm-checksums.txt | sha256sum -c - )
        tar -xzf "/tmp/${TARBALL}" -C /tmp nfpm
        sudo install -m 0755 /tmp/nfpm /usr/local/bin/nfpm
        nfpm --version

  build:deb:
    desc: Package pre-built Linux binaries as .deb (requires nfpm on PATH)
    cmds:
      - |
        set -euo pipefail
        VERSION="{{.VERSION | default "dev"}}"
        for pair in "amd64:dist/forst-linux-amd64:dist/plugins-linux-amd64" "arm64:dist/forst-linux-arm64:dist/plugins-linux-arm64"; do
          IFS=: read -r ARCH GO_BINARY GO_PLUGINS_DIR <<< "${pair}"
          if [ ! -f "$GO_BINARY" ]; then
            echo "missing binary: $GO_BINARY (run task build:release first)" >&2
            exit 1
          fi
          if [ ! -d "$GO_PLUGINS_DIR" ]; then
            echo "missing plugins dir: $GO_PLUGINS_DIR (run task build:release first)" >&2
            exit 1
          fi
          export VERSION ARCH GO_BINARY GO_PLUGINS_DIR
          nfpm package --packager deb --config nfpm.yaml --target dist/
        done
        ls -la dist/forst_*.deb
    generates:
      - dist/forst_*.deb

  test:deb:
    desc: Build a dev .deb and assert package metadata (Linux only)
    cmds:
      - |
        set -euo pipefail
        if [ "$(uname -s)" != Linux ]; then
          echo "test:deb requires Linux (dpkg-deb); run in CI or a Linux container" >&2
          exit 1
        fi
        VERSION="{{.VERSION | default "0.0.0-test"}}"
        NFPM_VERSION="{{.NFPM_VERSION}}"
        BINARY="dist/forst-linux-amd64"
        if [ ! -f "$BINARY" ]; then
          echo "building $BINARY for deb test..." >&2
          task build:release VERSION="$VERSION" COMMIT=test DATE=test
        fi
        if ! command -v nfpm >/dev/null 2>&1; then
          ARCH="$(uname -m)"
          case "$ARCH" in
            x86_64) NFPM_ARCH=x86_64 ;;
            aarch64|arm64) NFPM_ARCH=arm64 ;;
            *) echo "unsupported arch for nfpm: $ARCH" >&2; exit 1 ;;
          esac
          TARBALL="nfpm_${NFPM_VERSION}_Linux_${NFPM_ARCH}.tar.gz"
          BASE="https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}"
          curl -fsSL -o "/tmp/${TARBALL}" "${BASE}/${TARBALL}"
          tar -xzf "/tmp/${TARBALL}" -C /tmp nfpm
          export PATH="/tmp:${PATH}"
        fi
        rm -f dist/forst_*_amd64.deb
        export VERSION ARCH=amd64 GO_BINARY="$BINARY" GO_PLUGINS_DIR="dist/plugins-linux-amd64"
        nfpm package --packager deb --config nfpm.yaml --target dist/
        DEB="$(ls -1t dist/forst_*_amd64.deb | head -1)"
        if [ -z "$DEB" ] || [ ! -f "$DEB" ]; then
          echo "expected amd64 deb not found under dist/" >&2
          ls -la dist/ >&2
          exit 1
        fi
        PKG="$(dpkg-deb -f "$DEB" Package)"
        if [ "$PKG" != forst ]; then
          echo "unexpected Package field: $PKG" >&2
          exit 1
        fi
        DESC="$(dpkg-deb -f "$DEB" Description)"
        for needle in "ergonomic backend language" "compiles to Go" "TypeScript"; do
          if ! printf '%s' "$DESC" | grep -Fq "$needle"; then
            echo "Description missing expected text: $needle" >&2
            printf '%s\n' "$DESC" >&2
            exit 1
          fi
        done
        rm -rf /tmp/forst-deb-test
        dpkg-deb -x "$DEB" /tmp/forst-deb-test
        /tmp/forst-deb-test/usr/bin/forst version
        echo "deb package test passed: $DEB"

  build:vsix:
    desc: |
      Production .vsix: rewrite @forst/cli, bun install, materialize @forst/cli for compile, compile, then
      package-vsix-from-stage (vsce from a temp dir so npm list does not include the monorepo root).
      Restores package.json and bun.lockb after. Depends on build:cli for packages/cli/dist.
    dir: packages/vscode-forst
    deps: [install:bun, build:cli]
    cmds:
      - |
        set -euo pipefail
        cleanup() {
          git checkout -- package.json ../../bun.lockb
        }
        trap cleanup EXIT
        node ../sidecar/scripts/rewrite-cli-workspace-dep-for-publish.mjs package.json
        bun install
        node ./scripts/materialize-cli-dep-for-vsix.mjs
        mkdir -p ../../dist
        bun run compile
        node ./scripts/package-vsix-from-stage.mjs ../../dist/forst-vscode-{{.VERSION | default "dev"}}.vsix

  release:check:
    desc: Check release configuration
    dir: forst
    cmds:
      - echo "Release configuration checked"
      - echo "Using Release Please for automated releases"

  release:please:
    desc: Run Release Please locally
    dir: forst
    cmds:
      - npx release-please manifest
      - echo "Release Please manifest generated"
      - echo "Use 'npx release-please create-pr' to create a release PR"
      - echo "Use 'npx release-please github-release' to create a GitHub release"

  release:test:
    desc: Test build with sample version info
    dir: forst
    cmds:
      - task build:release VERSION=1.0.0-test COMMIT=test-commit DATE=2024-01-01T00:00:00Z
      - echo "Test build completed with version info"

  docker:build:
    desc: Build local Docker images (default with Go, and minimal side image)
    cmds:
      - |
        docker build -f docker/Dockerfile -t forst-local:default \
          --build-arg VERSION=dev --build-arg COMMIT=local --build-arg DATE=unknown .
      - |
        docker build -f docker/Dockerfile --target minimal -t forst-local:minimal \
          --build-arg VERSION=dev --build-arg COMMIT=local --build-arg DATE=unknown .

  docker:smoke:
    desc: Smoke test local Docker images
    deps: [docker:build]
    cmds:
      - docker run --rm forst-local:default version
      - |
        docker run --rm \
          -v "{{.TASKFILE_DIR}}/examples/in:/workspace" \
          -w /workspace \
          forst-local:default run basic.ft
      - docker run --rm forst-local:minimal version

  install:bun:
    desc: Install bun dependencies
    cmds:
      - bun install
    run: once
