  example:slice-alias-methods:
    desc: Compile named slice alias + append mutual methods example
    dir: forst
    cmds:
      - go run ./{{.BUILD_DIR}} run -loglevel trace -report-phases -- {{.EXAMPLES_DIR}}/slice_alias_methods.ft

  example:result-if:
    desc: Compile Result + if x is Ok() example (golden examples/out/result_if/)
    dir: forst
    cmds:
      - go run ./{{.BUILD_DIR}} run -loglevel trace -report-phases -- {{.EXAMPLES_DIR}}/result_if.ft

  example:providers:
