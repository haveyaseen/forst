        trap 'kill -TERM $PID 2>/dev/null || true; bash ../scripts/kill-forst-tcp-listeners.sh 6321' EXIT
        bash ../scripts/wait-for-url.sh http://127.0.0.1:6321/health invoke 30
        curl -sf -X POST http://127.0.0.1:6321/invoke \
